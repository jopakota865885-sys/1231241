name: Build APK

on:
  workflow_dispatch:  # Позволяет запускать вручную
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 1. Устанавливаем Java 17 (требуется для современных Android SDK)
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libtool autoconf automake pkg-config zip unzip

      - name: Setup Android SDK
        run: |
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          
          # Скачиваем последние cmdline-tools
          curl -sSL -o /tmp/tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/tools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          
          # Экспортируем переменные для sdkmanager
          export PATH=$PATH:$SDK/cmdline-tools/latest/bin:$SDK/platform-tools
          export JAVA_HOME=$JAVA_HOME_17_X64
          
          # Принимаем лицензии
          yes | sdkmanager --licenses > /dev/null || true
          
          # Устанавливаем компоненты
          sdkmanager "platform-tools" "build-tools;33.0.2" "platforms;android-33"
          
          # Сохраняем переменные окружения для следующих шагов
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROIDSDK=$SDK" >> $GITHUB_ENV
          echo "PATH=$PATH:$SDK/build-tools/33.0.2:$SDK/platform-tools:$SDK/cmdline-tools/latest/bin" >> $GITHUB_ENV

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Build APK with Buildozer
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROIDSDK: ${{ env.ANDROIDSDK }}
        run: |
          # Инициализация (если нужно) и сборка
          # Флаг --verbose поможет увидеть детали, если снова будет ошибка
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: bin/*.apk
