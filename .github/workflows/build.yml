name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libtool autoconf automake pkg-config zip unzip openssl git wget

      - name: Install Buildozer
        run: pip install --upgrade buildozer cython

      - name: Setup Android SDK (Fix for Buildozer)
        run: |
          # Определяем пути
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          CMDLINE_DIR="$SDK_DIR/cmdline-tools/latest"
          TOOLS_OLD_DIR="$SDK_DIR/tools/bin"
          
          # Создаем структуру
          mkdir -p "$CMDLINE_DIR"
          mkdir -p "$TOOLS_OLD_DIR"
          
          # Скачиваем и распаковываем
          cd /tmp
          echo "📥 Downloading Command Line Tools..."
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip
          mv cmdline-tools "$CMDLINE_DIR"
          
          # Устанавливаем компоненты, используя ПОЛНЫЙ ПУТЬ к sdkmanager
          export JAVA_HOME=$JAVA_HOME_17_X64
          SDKMANAGER="$CMDLINE_DIR/bin/sdkmanager"
          
          echo "📝 Accepting licenses..."
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          
          echo "📦 Installing build-tools, platform-tools and platforms..."
          "$SDKMANAGER" "platform-tools" "build-tools;33.0.2" "platforms;android-33"
          
          # КРИТИЧЕСКИЙ ШАГ: Создаем симлинки в старую папку tools/bin, которую ищет Buildozer
          echo "🔗 Creating compatibility symlinks for Buildozer..."
          ln -sf "$CMDLINE_DIR/bin/sdkmanager" "$TOOLS_OLD_DIR/sdkmanager"
          ln -sf "$CMDLINE_DIR/bin/avdmanager" "$TOOLS_OLD_DIR/avdmanager"
          ln -sf "$CMDLINE_DIR/bin/apksigner" "$TOOLS_OLD_DIR/apksigner"
          
          # Проверка
          if [ -f "$TOOLS_OLD_DIR/sdkmanager" ] && [ -f "$SDK_DIR/build-tools/33.0.2/aidl" ]; then
            echo "✅ SUCCESS: SDK setup complete. Symlinks created. AIDL found."
            ls -la "$TOOLS_OLD_DIR"
          else
            echo "❌ ERROR: Setup failed."
            exit 1
          fi
          
          # Экспорт переменных
          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "ANDROIDSDK=$SDK_DIR" >> $GITHUB_ENV
          echo "PATH=$PATH:$SDK_DIR/build-tools/33.0.2:$SDK_DIR/platform-tools:$TOOLS_OLD_DIR" >> $GITHUB_ENV

      - name: Build APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROIDSDK: ${{ env.ANDROIDSDK }}
        run: |
          # Очищаем кэш сборки, чтобы избежать ошибок от предыдущих попыток
          rm -rf .buildozer/android/platform/build
          buildozer android debug
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: bin/*.apk
