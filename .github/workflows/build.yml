name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libtool autoconf automake pkg-config \
            zip unzip openjdk-17-jdk

      - name: Prepare Android SDK (fix "Aidl not found")
        run: |
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -sSL -o /tmp/tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/tools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          
          # Принять лицензии
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          
          # Установить необходимые компоненты (без флага -y, чтобы избежать проблем)
          echo "y" | "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "build-tools;33.0.2" \
            "platforms;android-33"
          
          # Экспорт переменных окружения
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROIDSDK=$SDK" >> $GITHUB_ENV
          echo "PATH=$PATH:$SDK/build-tools/33.0.2:$SDK/platform-tools" >> $GITHUB_ENV
          
          # Проверка наличия aidl
          if [ -f "$SDK/build-tools/33.0.2/aidl" ]; then
            echo "✅ AIDL найден: $SDK/build-tools/33.0.2/aidl"
          else
            echo "❌ Ошибка: AIDL не найден!"
            ls -la "$SDK/build-tools/33.0.2/"
            exit 1
          fi

      - name: Install buildozer
        run: pip install buildozer cython

      - name: Build APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROIDSDK: ${{ env.ANDROIDSDK }}
        run: |
          echo "🔍 Проверка PATH: $PATH"
          which aidl || echo "⚠️ aidl не найден в PATH"
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: journal-apk
          path: bin/*.apk
