name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libtool autoconf automake pkg-config zip unzip openssl git wget

      - name: Install Buildozer
        run: pip install --upgrade buildozer cython

      # КЭШИРОВАНИЕ: Сохраняем скачанные SDK и скомпилированные библиотеки
      - name: Cache Buildozer Global
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec', '.gitignore') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Setup Android SDK (Fixed Structure)
        run: |
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          CMDLINE_DIR="$SDK_DIR/cmdline-tools/latest"
          
          if [ ! -d "$CMDLINE_DIR/bin" ]; then
            echo "📂 Creating directory structure..."
            mkdir -p "$CMDLINE_DIR"
            
            echo "📥 Downloading Command Line Tools..."
            cd /tmp
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
            unzip -q tools.zip
            
            mv cmdline-tools/bin "$CMDLINE_DIR/"
            mv cmdline-tools/lib "$CMDLINE_DIR/"
            mv cmdline-tools/NOTICE.txt "$CMDLINE_DIR/"
            mv cmdline-tools/source.properties "$CMDLINE_DIR/"
            
            mkdir -p "$SDK_DIR/tools/bin"
            ln -s "$CMDLINE_DIR/bin/sdkmanager" "$SDK_DIR/tools/bin/sdkmanager"
            ln -s "$CMDLINE_DIR/bin/avdmanager" "$SDK_DIR/tools/bin/avdmanager"
            
            export JAVA_HOME=$JAVA_HOME_17_X64
            export PATH=$PATH:$CMDLINE_DIR/bin
            
            echo "📝 Accepting licenses..."
            yes | "$CMDLINE_DIR/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            
            echo "📦 Installing components..."
            "$CMDLINE_DIR/bin/sdkmanager" "platform-tools" "build-tools;33.0.2" "platforms;android-33"
          else
            echo "✅ SDK already exists, skipping download."
          fi
          
          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "ANDROIDSDK=$SDK_DIR" >> $GITHUB_ENV
          echo "PATH=$PATH:$SDK_DIR/build-tools/33.0.2:$SDK_DIR/platform-tools:$CMDLINE_DIR/bin" >> $GITHUB_ENV

      - name: Build APK (No Clean)
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROIDSDK: ${{ env.ANDROIDSDK }}
        run: |
          # ВАЖНО: Мы НЕ удаляем папку build, чтобы использовать кэш
          # rm -rf .buildozer/android/platform/build  <-- ЭТУ СТРОКУ МЫ УБРАЛИ
          
          # Запускаем сборку
          buildozer android debug
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: bin/*.apk
