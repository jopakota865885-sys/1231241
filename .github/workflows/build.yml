ame: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libtool autoconf automake pkg-config zip unzip openssl git wget

      - name: Install Buildozer
        run: pip install --upgrade buildozer cython

      - name: Prepare Android SDK (Fix for Buildozer)
        run: |
          # Пути
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          CMDLINE_DIR="$SDK_DIR/cmdline-tools/latest"
          OLD_TOOLS_DIR="$SDK_DIR/tools"
          
          mkdir -p "$CMDLINE_DIR"
          mkdir -p "$OLD_TOOLS_DIR/bin"
          
          # Скачивание cmdline-tools
          cd /tmp
          echo "Downloading Android Command Line Tools..."
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip
          mv cmdline-tools "$CMDLINE_DIR"
          
          # Настройка переменных
          export PATH=$PATH:$CMDLINE_DIR/bin:$SDK_DIR/platform-tools
          export JAVA_HOME=$JAVA_HOME_17_X64
          export ANDROID_HOME=$SDK_DIR
          export ANDROID_SDK_ROOT=$SDK_DIR
          
          # Принятие лицензий
          echo "Accepting licenses..."
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          
          # Установка компонентов
          echo "Installing components..."
          sdkmanager "platform-tools" "build-tools;33.0.2" "platforms;android-33" "ndk;28.0.12674087"
          
          # === ГЛАВНОЕ ИСПРАВЛЕНИЕ ===
          # Buildozer ищет sdkmanager в старом пути tools/bin. 
          # Создадим ссылку на текущий sdkmanager, чтобы Buildozer его нашел.
          ln -sf "$CMDLINE_DIR/bin/sdkmanager" "$OLD_TOOLS_DIR/bin/sdkmanager"
          ln -sf "$CMDLINE_DIR/bin/avdmanager" "$OLD_TOOLS_DIR/bin/avdmanager"
          
          # Проверка
          if [ -f "$OLD_TOOLS_DIR/bin/sdkmanager" ] && [ -f "$SDK_DIR/build-tools/33.0.2/aidl" ]; then
            echo "✅ SUCCESS: SDK structure fixed. AIDL and sdkmanager found."
          else
            echo "❌ ERROR: Fix failed."
            ls -R "$SDK_DIR"
            exit 1
          fi
          
          # Сохранение переменных окружения
          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "ANDROIDSDK=$SDK_DIR" >> $GITHUB_ENV
          echo "PATH=$PATH:$CMDLINE_DIR/bin:$SDK_DIR/build-tools/33.0.2:$SDK_DIR/platform-tools" >> $GITHUB_ENV

      - name: Build APK with Buildozer
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROIDSDK: ${{ env.ANDROIDSDK }}
        run: |
          rm -rf .buildozer/android/platform/build
          buildozer android debug
        
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: bin/*.apk
