name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libtool autoconf automake pkg-config zip unzip openssl git wget

      - name: Install Buildozer
        run: pip install --upgrade buildozer cython

      - name: Prepare Android SDK (Fixed Path)
        run: |
          # Путь, который ожидает Buildozer
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          
          # Создаем структуру для cmdline-tools
          mkdir -p "$SDK_DIR/cmdline-tools"
          
          cd /tmp
          echo "Downloading Android Command Line Tools..."
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip
          
          # ВАЖНО: Перемещаем распакованную папку в latest внутри cmdline-tools
          mv cmdline-tools "$SDK_DIR/cmdline-tools/latest"
          
          # Устанавливаем переменные окружения ДЛЯ ТЕКУЩЕЙ СЕССИИ
          export PATH=$PATH:$SDK_DIR/cmdline-tools/latest/bin:$SDK_DIR/platform-tools
          export JAVA_HOME=$JAVA_HOME_17_X64
          export ANDROID_HOME=$SDK_DIR
          export ANDROID_SDK_ROOT=$SDK_DIR
          
          echo "Current PATH: $PATH"
          echo "Checking sdkmanager location..."
          ls -R "$SDK_DIR/cmdline-tools"
          
          # Проверяем, виден ли sdkmanager
          if ! command -v sdkmanager &> /dev/null; then
            echo "❌ sdkmanager not found in PATH. Trying direct execution..."
            SDKMANAGER_BIN="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
            if [ ! -f "$SDKMANAGER_BIN" ]; then
              echo "❌ Critical Error: sdkmanager binary missing at $SDKMANAGER_BIN"
              exit 1
            fi
            # Если в PATH нет, используем полный путь
            alias sdkmanager="$SDKMANAGER_BIN"
          fi
          
          echo "Accepting licenses..."
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          
          echo "Installing build-tools;33.0.2 and platforms;android-33..."
          sdkmanager "platform-tools" "build-tools;33.0.2" "platforms;android-33"
          
          # Финальная проверка наличия aidl
          AIDL_PATH="$SDK_DIR/build-tools/33.0.2/aidl"
          if [ -f "$AIDL_PATH" ]; then
            echo "✅ SUCCESS: AIDL found at $AIDL_PATH"
          else
            echo "❌ CRITICAL ERROR: AIDL not found!"
            ls -R "$SDK_DIR/build-tools/" || echo "build-tools folder missing"
            exit 1
          fi
          
          # Сохраняем переменные для следующих шагов (для Buildozer)
          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "ANDROIDSDK=$SDK_DIR" >> $GITHUB_ENV
          echo "PATH=$PATH:$SDK_DIR/build-tools/33.0.2:$SDK_DIR/platform-tools:$SDK_DIR/cmdline-tools/latest/bin" >> $GITHUB_ENV

      - name: Build APK with Buildozer
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROIDSDK: ${{ env.ANDROIDSDK }}
        run: |
          rm -rf .buildozer/android/platform/build
          buildozer android debug
        
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: bin/*.apk
