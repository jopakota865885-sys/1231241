name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libtool autoconf automake pkg-config zip unzip openssl git wget

      - name: Install Buildozer
        run: pip install --upgrade buildozer cython

      - name: Setup Android SDK (Fixed for Buildozer)
        run: |
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          CMDLINE_DIR="$SDK_DIR/cmdline-tools/latest"
          
          echo "📂 Creating directory structure: $CMDLINE_DIR"
          mkdir -p "$CMDLINE_DIR"
          
          echo "📥 Downloading Android Command Line Tools..."
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip
          
          mv cmdline-tools/bin "$CMDLINE_DIR/"
          mv cmdline-tools/lib "$CMDLINE_DIR/"
          mv cmdline-tools/NOTICE.txt "$CMDLINE_DIR/"
          mv cmdline-tools/source.properties "$CMDLINE_DIR/"
          
          mkdir -p "$SDK_DIR/tools/bin"
          ln -s "$CMDLINE_DIR/bin/sdkmanager" "$SDK_DIR/tools/bin/sdkmanager"
          ln -s "$CMDLINE_DIR/bin/avdmanager" "$SDK_DIR/tools/bin/avdmanager"
          
          export JAVA_HOME=$JAVA_HOME_17_X64
          export PATH=$PATH:$CMDLINE_DIR/bin
          
          echo "📝 Accepting licenses..."
          yes | "$CMDLINE_DIR/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          
          echo "📦 Installing build-tools, platform-tools and platforms..."
          "$CMDLINE_DIR/bin/sdkmanager" "platform-tools" "build-tools;33.0.2" "platforms;android-33"
          
          if [ -f "$SDK_DIR/build-tools/33.0.2/aidl" ]; then
            echo "✅ SUCCESS: AIDL found!"
          else
            echo "❌ ERROR: AIDL not found in build-tools!"
            exit 1
          fi
          
          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "ANDROIDSDK=$SDK_DIR" >> $GITHUB_ENV
          echo "PATH=$PATH:$SDK_DIR/build-tools/33.0.2:$SDK_DIR/platform-tools:$CMDLINE_DIR/bin" >> $GITHUB_ENV

      - name: Build APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROIDSDK: ${{ env.ANDROIDSDK }}
        run: |
          rm -rf .buildozer/android/platform/build
          buildozer android debug
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: bin/*.apk
