name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Install system packages (libtool fixes libffi error!)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libtool libtool-bin autoconf automake \
            pkg-config zip unzip zlib1g-dev \
            openjdk-17-jdk gettext cmake

      - name: Build APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: journal-apk
          path: bin/*.apk
